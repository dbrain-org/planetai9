name: planetai9

# Self-hosted production stack. Provide secrets via infra/.env.prod
# (see .env.prod.example). Bring up with:
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# TLS: put a reverse proxy in front of `web` (which only binds to localhost).
#   - bring your own (Nginx/Traefik/…), or
#   - use the bundled Caddy:  … --profile caddy up -d   (needs SITE_DOMAIN in .env.prod)

x-common-env: &common-env
  PLANETAI_ENV: production
  PLANETAI_DATABASE_URL: postgresql+psycopg://planetai:${POSTGRES_PASSWORD}@postgres:5432/planetai
  PLANETAI_REDIS_URL: redis://redis:6379/0
  PLANETAI_SITE_URL: ${SITE_URL}
  PLANETAI_SENTRY_DSN: ${SENTRY_DSN:-}
  PLANETAI_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planetai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planetai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planetai"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Daily pg_dump → pgbackups volume, gzip'd, with retention.
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: planetai
      POSTGRES_USER: planetai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
    volumes:
      - pgbackups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  # Optional off-site backups — enable with `--profile offsite`.
  # Ships the pgbackups volume (the local pg_dumps, compressed) to S3-compatible
  # storage on a cron. Set OFFSITE_S3_* in infra/.env.prod.
  backup-offsite:
    image: offen/docker-volume-backup:v2
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: ${OFFSITE_CRON:-30 3 * * *}
      BACKUP_FILENAME: planetai-%Y%m%dT%H%M%S.tar.gz
      BACKUP_PRUNING_PREFIX: planetai-
      BACKUP_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-30}
      AWS_S3_BUCKET_NAME: ${OFFSITE_S3_BUCKET:-}
      AWS_S3_PATH: ${OFFSITE_S3_PATH:-planetai-backups}
      AWS_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_KEY:-}
      AWS_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}      # host only; set for B2 / R2 / MinIO, blank = AWS
    volumes:
      - pgbackups:/backup/pgbackups:ro
    depends_on:
      backup: { condition: service_started }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PLANETAI_CORS_ORIGINS: ${SITE_URL}
      PLANETAI_DOCS_ENABLED: "false"
      PLANETAI_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PLANETAI_AUTHOR_KEYS: ${AUTHOR_KEYS:-}
      PLANETAI_MODERATOR_AUTHORS: ${MODERATOR_AUTHORS:-}
      PORT: "8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PLANETAI_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "planetai-ingest", "healthz"]
      interval: 120s
      timeout: 20s
      retries: 3
      start_period: 600s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PLANETAI_ENV: production
      HOSTNAME: "0.0.0.0"
      PLANETAI_API_URL: http://api:8000
      PLANETAI_SITE_URL: ${SITE_URL}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      PORT: "3000"
    # The host port stays localhost-only; Traefik reaches the container over the external web network.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.planetai9.rule=Host(`planetai9.com`)"
      - "traefik.http.routers.planetai9.entrypoints=websecure"
      - "traefik.http.routers.planetai9.tls=true"
      - "traefik.http.routers.planetai9.tls.certresolver=le"
      - "traefik.http.routers.planetai9.priority=10"
      - "traefik.http.services.planetai9.loadbalancer.server.port=3000"
    networks:
      - default
      - web

  # Optional bundled TLS proxy — enable with `--profile caddy`. Needs SITE_DOMAIN.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN (host only, no scheme) to use the caddy profile}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }

volumes:
  pgdata:
  pgbackups:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  default:
  web:
    external: true
