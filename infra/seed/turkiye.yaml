# Editorial link cards for the "Türkiye'de Yapay Zekâ" page.
# Bootstrap only: seeded into an empty `curated_links` collection. Once rows exist,
# edit them from the /yazar studio (Türkiye tab) — the DB is then the source of truth.

tr_data:
  - name: TCMB EVDS
    kind: istatistik
    url: https://evds2.tcmb.gov.tr
    note_tr: "Merkez Bankası Elektronik Veri Dağıtım Sistemi — makroekonomik ve finansal seriler, API."
    note_en: "Central Bank's Electronic Data Delivery System — macro & financial time series, with an API."
  - name: TÜİK Veri Portalı
    kind: istatistik
    url: https://data.tuik.gov.tr
    note_tr: "Türkiye İstatistik Kurumu'nun resmi istatistik ve mikro veri servisi."
    note_en: "Official statistics and micro-data from the Turkish Statistical Institute."
  - name: İBB Açık Veri Portalı
    kind: yerel
    url: https://data.ibb.gov.tr
    note_tr: "İstanbul Büyükşehir Belediyesi — ulaşım, çevre ve şehir verisi."
    note_en: "Istanbul metropolitan municipality — transport, environment and city data."
  - name: AperTA (ULAKBİM)
    kind: akademik
    url: https://aperta.ulakbim.gov.tr
    note_tr: "TÜBİTAK ULAKBİM Açık Erişim ve Açık Bilim platformu; araştırma veri setleri."
    note_en: "TÜBİTAK's open-access / open-science platform with research datasets."
  - name: TDD — Turkish Data Depository
    kind: nlp
    url: https://tdd.ai
    note_tr: "Türkçe doğal dil işleme için derlenmiş veri setleri ve araçlar."
    note_en: "Curated datasets and tools for Turkish NLP."
  - name: Hugging Face — Türkçe veri setleri
    kind: nlp
    url: "https://huggingface.co/datasets?language=language:tr"
    note_tr: "Topluluk tarafından paylaşılan Türkçe metin, konuşma ve görüntü veri setleri."
    note_en: "Community-shared Turkish text, speech and vision datasets."
  - name: Mukayese / TQuAD / BOUN Treebank
    kind: nlp
    url: https://github.com/boun-tabi
    note_tr: "Boğaziçi TABI Lab — Türkçe için karşılaştırma (benchmark) ve etiketli veri."
    note_en: "Boğaziçi TABI Lab — Turkish benchmarks and annotated corpora."
  - name: Kaggle — Türkiye toplulukları
    kind: portal
    url: "https://www.kaggle.com/datasets?search=turkey"
    note_tr: "Türkiye odaklı açık veri setleri ve yarışma verileri."
    note_en: "Türkiye-focused open datasets and competition data."
  - name: FineWeb2-HQ (Türkçe)
    kind: nlp
    url: https://huggingface.co/datasets/epfml/FineWeb2-HQ
    note_tr: "tur_Latn — 8,58M belge / 100 GB. XLM-RoBERTa kalite filtresi, en yüksek %10. Lisans: ODC-By. Yaygınlık: orta."
    note_en: "tur_Latn — 8.58M docs / 100 GB. XLM-RoBERTa quality filter, top 10%. License: ODC-By. Prevalence: medium."
  - name: HPLT 3.0
    kind: nlp
    url: https://huggingface.co/datasets/HPLT/HPLT3.0
    note_tr: "Kaliteye sıralı geniş internet verisi — 149,98B token (Gemma 3). PII etiketli. Lisans: CC0. Yaygınlık: orta."
    note_en: "Quality-ranked broad web data — 149.98B tokens (Gemma 3). PII labeled. License: CC0. Prevalence: medium."
  - name: CulturaX
    kind: nlp
    url: https://huggingface.co/datasets/uonlp/CulturaX
    note_tr: "mC4 + OSCAR — Türkçe 64,3B token. Hashing ile benzer kopyalar azaltılmış. Lisans: ODC-By. Yaygınlık: yüksek."
    note_en: "mC4 + OSCAR — Turkish 64.3B tokens. Near-duplicates reduced via hashing. License: ODC-By. Prevalence: high."
  - name: Cosmos Turkish
    kind: nlp
    url: https://huggingface.co/datasets/alperngll/Cosmos-Turkish-Corpus-v1.0
    note_tr: "Haber, forum, Vikipedi, genel internet — 9,08M belge / ~15B token. Lisans: CC BY 4.0. Yaygınlık: düşük."
    note_en: "News, forums, Wikipedia, general web — 9.08M docs / ~15B tokens. License: CC BY 4.0. Prevalence: low."
  - name: Türkçe Vikipedi
    kind: nlp
    url: https://dumps.wikimedia.org/trwiki/
    note_tr: "Ansiklopedik ve izlenebilir dump’lar. Alan kapsamı sınırlı; ölçek yeniden ölçülmeli. Lisans: CC BY-SA. Yaygınlık: yüksek."
    note_en: "Encyclopedic, traceable dumps. Limited domain; scale needs re-measurement. License: CC BY-SA. Prevalence: high."
  - name: vngrs-web-corpus
    kind: nlp
    url: https://huggingface.co/datasets/vngrs-ai/vngrs-web-corpus
    note_tr: "OSCAR + mC4 Türkçe — 50,3M sayfa / 141,8 GB / 25,33B token (VBART). Lisans: CC BY-NC-SA 4.0."
    note_en: "Turkish OSCAR + mC4 — 50.3M pages / 141.8 GB / 25.33B tokens (VBART). License: CC BY-NC-SA 4.0."

