  - name: Hugging Face
    kind: şirket
    url: "https://huggingface.co/datasets?language=language:tr"
    note_tr: "Türkçe metin, konuşma ve görüntü veri setlerinin paylaşıldığı açık platform."
    note_en: "Open platform hosting Turkish text, speech and vision datasets."
  - name: Turkish Data Depository (TDD)
